<rect width="960" height="330" rx="18" fill="#070B16"/>
<text x="32" y="44" fill="#E8EEFA" font-size="21" font-weight="700">Do botão de ligar ao desktop</text>
<text x="32" y="68" fill="#7C8AA8" font-size="13.5">O caminho normal em cima; embaixo, a volta no tempo feita antes mesmo de o sistema montar.</text>
<rect x="40" y="110" width="152" height="62" rx="10" fill="#0D1428" stroke="#1F2C4D" stroke-width="1.5"/><text x="116.0" y="138.0" fill="#E8EEFA" font-size="14" font-weight="600" text-anchor="middle">Firmware</text><text x="116.0" y="156.0" fill="#7C8AA8" font-size="11.5" text-anchor="middle">BIOS ou UEFI + Secure Boot</text>
<rect x="222" y="110" width="152" height="62" rx="10" fill="#101C3D" stroke="#2D7FF9" stroke-width="1.5"/><text x="298.0" y="138.0" fill="#E8EEFA" font-size="14" font-weight="600" text-anchor="middle">GRUB</text><text x="298.0" y="156.0" fill="#7C8AA8" font-size="11.5" text-anchor="middle">tema MilizOS</text>
<rect x="404" y="110" width="152" height="62" rx="10" fill="#0D1428" stroke="#1F2C4D" stroke-width="1.5"/><text x="480.0" y="138.0" fill="#E8EEFA" font-size="14" font-weight="600" text-anchor="middle">initramfs</text><text x="480.0" y="156.0" fill="#7C8AA8" font-size="11.5" text-anchor="middle">animação 3D (Plymouth)</text>
<rect x="586" y="110" width="152" height="62" rx="10" fill="#101C3D" stroke="#2D7FF9" stroke-width="1.5"/><text x="662.0" y="138.0" fill="#E8EEFA" font-size="14" font-weight="600" text-anchor="middle">btrfs root</text><text x="662.0" y="156.0" fill="#7C8AA8" font-size="11.5" text-anchor="middle">monta o subvolume</text>
<rect x="768" y="110" width="152" height="62" rx="10" fill="#0D1428" stroke="#1F2C4D" stroke-width="1.5"/><text x="844.0" y="138.0" fill="#E8EEFA" font-size="14" font-weight="600" text-anchor="middle">GNOME</text><text x="844.0" y="156.0" fill="#7C8AA8" font-size="11.5" text-anchor="middle">desktop estático, leve</text>
<path d="M192 141L220 141" stroke="#7C8AA8" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M374 141L402 141" stroke="#7C8AA8" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M556 141L584 141" stroke="#7C8AA8" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M738 141L766 141" stroke="#7C8AA8" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="222" y="236" width="152" height="62" rx="10" fill="#0B2A33" stroke="#00F0C8" stroke-width="1.5"/><text x="298.0" y="264.0" fill="#E8EEFA" font-size="14" font-weight="600" text-anchor="middle">Submenu Heloisa</text><text x="298.0" y="282.0" fill="#7C8AA8" font-size="11.5" text-anchor="middle">15 pontos recentes</text>
<rect x="404" y="236" width="152" height="62" rx="10" fill="#0B2A33" stroke="#00F0C8" stroke-width="1.5"/><text x="480.0" y="264.0" fill="#E8EEFA" font-size="14" font-weight="600" text-anchor="middle">gancho de volta</text><text x="480.0" y="282.0" fill="#7C8AA8" font-size="11.5" text-anchor="middle">heloisa.rollback=N</text>
<rect x="586" y="236" width="152" height="62" rx="10" fill="#0B2A33" stroke="#00F0C8" stroke-width="1.5"/><text x="662.0" y="264.0" fill="#E8EEFA" font-size="14" font-weight="600" text-anchor="middle">root ← ponto N</text><text x="662.0" y="282.0" fill="#7C8AA8" font-size="11.5" text-anchor="middle">o quebrado é guardado</text>
<path d="M298 172L298 234" stroke="#00F0C8" stroke-width="1.6" fill="none" marker-end="url(#at)"/>
<path d="M374 267L402 267" stroke="#00F0C8" stroke-width="1.6" fill="none" marker-end="url(#at)"/>
<path d="M556 267L584 267" stroke="#00F0C8" stroke-width="1.6" fill="none" marker-end="url(#at)"/>
<path d="M662 234L662 174" stroke="#00F0C8" stroke-width="1.6" fill="none" marker-end="url(#at)"/>
<text x="40" y="262" fill="#00F0C8" font-size="12.5" font-weight="700">Caminho de resgate:</text>
<text x="40" y="282" fill="#7C8AA8" font-size="12" font-weight="400">o sistema não sobe?</text>
<text x="40" y="300" fill="#7C8AA8" font-size="12" font-weight="400">Escolha um ponto no boot.</text>
<text x="768" y="262" fill="#7C8AA8" font-size="12" font-weight="400">Cada ponto leva o kernel</text>
<text x="768" y="280" fill="#7C8AA8" font-size="12" font-weight="400">e o initramfs do seu tempo.</text>
</svg>
