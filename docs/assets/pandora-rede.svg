<rect x="500" y="300" width="190" height="100" rx="10" fill="#101C3D" stroke="#2D7FF9" stroke-width="1.5"/><text x="595.0" y="347.0" fill="#E8EEFA" font-size="15" font-weight="600" text-anchor="middle">Caixa em ponte</text><text x="595.0" y="365.0" fill="#7C8AA8" font-size="11.5" text-anchor="middle">usa a rede do host</text>
